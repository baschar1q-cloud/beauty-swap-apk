name: Build BeautySwap APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
      distribution: temurin
      java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          cat > settings.gradle <<'ENDOFFILE'
          pluginManagement {
          repositories {
      google()
          mavenCentral()
      gradlePluginPortal()
      }
      }
          include ':app'
      ENDOFFILE
      mkdir -p app/src/main/java/com/beautyswap/app
      mkdir -p app/src/main/res/layout
      mkdir -p app/src/main/res/values
          cat > app/build.gradle <<'ENDOFFILE'
          plugins {
      id 'com.android.application' version '8.1.4'
      }
      android {
      namespace 'com.beautyswap.app'
      compileSdk 34
      defaultConfig {
          applicationId 'com.beautyswap.app'
      minSdk 24
      targetSdk 34
      versionCode 1
          versionName '1.0'
      }
      }
      dependencies {
      implementation 'androidx.appcompat:appcompat:1.6.1'
      }
      ENDOFFILE
      cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:allowBackup="true" android:label="BeautySwap" android:theme="@android:style/Theme.NoTitleBar">
          <activity android:name=".MainActivity" android:exported="true">
      <intent-filter>
      <action android:name="android.intent.action.MAIN"/>
      <category android:name="android.intent.category.LAUNCHER"/>
      </intent-filter>
      </activity>
      </application>
          </manifest>
          ENDOFFILE
      cat > app/src/main/res/values/strings.xml <<'ENDOFFILE'
          <resources>
      <string name="app_name">BeautySwap</string>
      </resources>
      ENDOFFILE
      cat > app/src/main/res/layout/activity_main.xml <<'ENDOFFILE'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:orientation="vertical">
          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="BeautySwap Ready!" android:textSize="24sp"/
