name: Build BeautySwap APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create Project
        run: |
          echo "include ':app'" > settings.gradle
          mkdir -p app/src/main/java/com/beautyswap/app
          mkdir -p app/src/main/res/layout app/src/main/res/values
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
           namespace 'com.beautyswap.app'
           compileSdk 34
           defaultConfig { applicationId "com.beautyswap.app"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
           buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:allowBackup="true" android:label="Beauty Swap" android:theme="@android:style/Theme.NoTitleBar">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
           </application>
          </manifest>
          EOF
          echo '<resources><string name="app_name">Beauty Swap</string></resources>' > app/src/main/res/values/strings.xml
          echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:orientation="vertical" android:background="#111"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Beauty Swap Ready!" android:textSize="24sp" android:textColor="#fff"/></LinearLayout>' > app/src/main/res/layout/activity_main.xml
          cat > app/src/main/java/com/beautyswap/app/MainActivity.java << 'EOF'
          package com.beautyswap.app;
          import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
           protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); }
          }
          EOF
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.0
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BeautySwap-APK
          path: app/build/outputs/apk/debug/*.apk
